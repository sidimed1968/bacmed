services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: prepabac
      POSTGRES_PASSWORD: prepabac
      POSTGRES_DB: prepabac
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "prepabac", "-d", "prepabac"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./schema.sql:/schema.sql:ro
    environment:
      PGPASSWORD: prepabac
    command: ["psql", "-h", "db", "-U", "prepabac", "-d", "prepabac", "-f", "/schema.sql"]
    restart: "no"

  web:
    image: node:22-alpine
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
    command: ["sh", "-ec", "npm install -g pnpm@9.15.9 && pnpm install --frozen-lockfile && exec npx next dev --hostname 0.0.0.0 --port 3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  db-data:
  node_modules:
